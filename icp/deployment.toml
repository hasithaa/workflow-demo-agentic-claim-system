# Integration Control Plane for the claim demo: MySQL for its data and console users, password sign-in (admin / admin).
serverHost = "0.0.0.0"
serverPort = 9446
publicBaseUrl = "https://localhost:9446"
schedulerIntervalSeconds = 60
logLevel = "INFO"
enableAuditLogging = true
enableMetrics = true
frontendJwtHMACSecret = "claim-demo-console-secret-at-least-32-characters-long"

credentialsDbType = "mysql"
credentialsDbHost = "mysql"
credentialsDbPort = 3306
credentialsDbName = "credentials_db"
credentialsDbUser = "icp"
credentialsDbPassword = "icp"

# Single sign-on against Thunder (the demo's identity provider). The issuer must equal the token's `iss`, which is
# Thunder's browser-facing address; tokens and keys are fetched inside the Docker network. admin / admin still works.
ssoEnabled = true
ssoIssuer = "https://localhost:8095"
ssoAuthorizationEndpoint = "https://localhost:8095/oauth2/authorize"
ssoTokenEndpoint = "https://thunder:8090/oauth2/token"
ssoLogoutEndpoint = "https://localhost:8095/oauth2/logout"
ssoJwksUrl = "https://thunder:8090/oauth2/jwks"
ssoClientId = "icp-console"
ssoClientSecret = "icp-console-secret"
ssoRedirectUri = "https://localhost:9446/sso/callback"
ssoUsernameClaim = "email"
ssoScopes = ["openid", "email", "profile", "groups"]
ssoAllowInsecureTLS = true

[icp_server.storage]
dbType = "mysql"
dbHost = "mysql"
dbPort = 3306
dbName = "icp_db"
dbUser = "icp"
dbPassword = "icp"
maxOpenConnections = 10
minIdleConnections = 2
heartbeatTimeoutSeconds = 30
