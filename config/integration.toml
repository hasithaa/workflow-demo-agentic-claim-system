# The claims integration in docker compose. Running it from WSO2 Integrator instead: put the same values in
# integration/claimapproval/Config.toml with dbHost = "localhost", url = "localhost:7233" and both jwksUrl values
# "http://localhost:8080/oidc/jwks".
dbHost = "mysql"
dbUser = "claims"
dbPassword = "claims"
dbName = "claims"
# Thunder's signing keys, served over plain HTTP by the web gateway inside the network.
jwksUrl = "http://web:8080/oidc/jwks"

[ballerina.workflow]
mode = "LOCAL"
url = "temporal:7233"

[ballerina.workflow.management.rest]
enableManagementApi = true
port = 8234
# The apps send Thunder's access token; the web gateway passes it on in X-JWT-Assertion. The API validates it and
# takes the user and roles from its claims.
enableBasicAuth = false
enableJwtAuth = true
jwtAuthHeader = "X-JWT-Assertion"
jwksUrl = "http://web:8080/oidc/jwks"
jwtIssuer = "https://localhost:8095"
userIdClaim = "username"
rolesClaim = "groups"
